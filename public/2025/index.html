<script>
    // TODO(2025 team data): Real team roster not yet supplied for MBMC IdeaX 2025.
    // Populate this array the same way prior years did: img (path under /team_images/),
    // name, depart (role), category (must match a filterProduct() button value above),
    // class ("img-style1" for full-bleed photos / "img-style2" for headshots), social, socialType.
    // Leaving this empty renders an empty grid (safe) rather than guessed names/photos.
    const teamData = [
    ];

        const teamArea = document.querySelector('.team-members');

        function loadTeamMembers() {
            teamArea.innerHTML = '';
            renderTeamMembers(teamData);
        }

        // Function to render team members
        function renderTeamMembers(data) {
            for (let i = 0; i < data.length; i++) {
                let teamCard = document.createElement("div");
                teamCard.classList.add('team-card', data[i].category);

                teamCard.innerHTML = `
                <img src="${data[i].img}" alt="${data[i].name}" class="profile-img ${data[i].class}" onerror="this.style.display='none'">
                <h2 class="team-name">${data[i].name}</h2>
                <p class="team-depart">${data[i].depart}</p>
                ${
                    data[i].social
                    ? `<a href="${data[i].social}" class="team-social-link" target="_blank" rel="noopener noreferrer">
                    <i class="fa-brands fa-${data[i].socialType}"></i>
                    </a>`
                    : ""
                }
                `;
                teamArea.appendChild(teamCard);
            }
        }

        // Filter toggle functionality
        document.querySelector('.team-filter i').addEventListener('click', function() {
            const buttons = document.querySelector('.buttons');
            buttons.classList.toggle('buttons-hide');
        });

        // Close filter when clicking outside
        document.addEventListener('click', function(event) {
            const teamFilter = document.querySelector('.team-filter');
            const buttons = document.querySelector('.buttons');
            
            if (!teamFilter.contains(event.target)) {
                buttons.classList.add('buttons-hide');
            }
        });

        // Filter function
        function filterProduct(value) {
            let elements = document.querySelectorAll(".team-card");
            let buttons = document.querySelector('.buttons');
            buttons.classList.add('buttons-hide');
            
            elements.forEach((element) => {
                if (value == "all") {
                    element.classList.remove("hide");
                } else {
                    if (element.classList.contains(value)) {
                        element.classList.remove("hide");
                    } else {
                        element.classList.add("hide");
                    }
                }
            });
        }
        document.addEventListener('DOMContentLoaded', loadTeamMembers);
    </script>
